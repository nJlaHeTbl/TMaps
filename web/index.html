<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#15803D">
  <meta name="description" content="TMaps — туалеты, доступные заведения и зарядка телефона рядом.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TMaps">
  <link rel="apple-touch-icon" href="icons/TMaps-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="icons/TMaps-192.png"/>

  <title>TMaps — туалеты рядом</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // Keep one public address and retire the old ?release=... links.
    const canonicalUrl = new URL(window.location.href);
    if (canonicalUrl.searchParams.has('release')) {
      canonicalUrl.searchParams.delete('release');
      const query = canonicalUrl.searchParams.toString();
      window.history.replaceState(
        null,
        '',
        `${canonicalUrl.pathname}${query ? `?${query}` : ''}${canonicalUrl.hash}`,
      );
    }

    // Prepare the page before Flutter downloads main.dart.js. Older releases
    // installed a service worker that could otherwise serve the previous app
    // even after a successful deployment.
    window.tmapsPrepareForLatestBuild = (async () => {
      const appPath = new URL(document.baseURI).pathname;
      const hadController =
        'serviceWorker' in navigator && navigator.serviceWorker.controller;

      if ('serviceWorker' in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        await Promise.all(
          registrations
            .filter((registration) =>
              new URL(registration.scope).pathname.startsWith(appPath),
            )
            .map((registration) => registration.unregister()),
        );
      }

      // Delete only cached requests that belong to /TMaps/. Do not clear
      // unrelated applications hosted on the same github.io origin.
      if ('caches' in window) {
        const cacheNames = await caches.keys();
        await Promise.all(
          cacheNames.map(async (cacheName) => {
            const cache = await caches.open(cacheName);
            const requests = await cache.keys();
            await Promise.all(
              requests
                .filter((request) =>
                  new URL(request.url).pathname.startsWith(appPath),
                )
                .map((request) => cache.delete(request)),
            );
          }),
        );
      }

      // A worker keeps controlling the current document until navigation.
      // Reload once after unregistering so this very launch is already fresh.
      const reloadKey = 'tmaps_worker_reset_20260827';
      if (hadController && sessionStorage.getItem(reloadKey) !== 'done') {
        sessionStorage.setItem(reloadKey, 'done');
        window.location.reload();
        return false;
      }
      sessionStorage.removeItem(reloadKey);
      return true;
    })().catch((error) => {
      console.warn('TMaps could not retire its old offline cache.', error);
      return true;
    });
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Cloudflare Turnstile: loaded only when the user sends something, so
    // just viewing the map does not contact challenges.cloudflare.com.
    window.tmapsTurnstile = (function () {
      var loading = null;
      function load() {
        if (window.turnstile) return Promise.resolve();
        if (!loading) {
          loading = new Promise(function (resolve, reject) {
            var script = document.createElement('script');
            script.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
            script.async = true;
            script.onload = function () { resolve(); };
            script.onerror = function () { loading = null; reject(new Error('turnstile-load')); };
            document.head.appendChild(script);
          });
        }
        return loading;
      }
      function getToken(siteKey) {
        return load().then(function () {
          return new Promise(function (resolve, reject) {
            var box = document.createElement('div');
            box.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:2147483647';
            document.body.appendChild(box);
            var widgetId = null;
            var finished = false;
            var timer = null;
            function finish(callback, value) {
              if (finished) return;
              finished = true;
              clearTimeout(timer);
              try { if (widgetId !== null) window.turnstile.remove(widgetId); } catch (_) {}
              box.remove();
              callback(value);
            }
            timer = setTimeout(function () { finish(reject, new Error('turnstile-timeout')); }, 120000);
            widgetId = window.turnstile.render(box, {
              sitekey: siteKey,
              appearance: 'interaction-only',
              callback: function (token) { finish(resolve, token); },
              'error-callback': function () { finish(reject, new Error('turnstile-error')); return true; }
            });
          });
        });
      }
      return { getToken: getToken };
    })();
  </script>
  <script>
    {{flutter_bootstrap_js}}
  </script>
</body>
</html>
