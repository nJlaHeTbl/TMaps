<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#15803D">
  <meta name="description" content="TMaps — туалеты, доступные заведения и зарядка телефона рядом.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TMaps">
  <link rel="apple-touch-icon" href="icons/TMaps-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="icons/TMaps-192.png"/>

  <title>TMaps — туалеты рядом</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // Keep one public address and retire the old ?release=... links.
    const canonicalUrl = new URL(window.location.href);
    if (canonicalUrl.searchParams.has('release')) {
      canonicalUrl.searchParams.delete('release');
      const query = canonicalUrl.searchParams.toString();
      window.history.replaceState(
        null,
        '',
        `${canonicalUrl.pathname}${query ? `?${query}` : ''}${canonicalUrl.hash}`,
      );
    }

    // Older Flutter builds installed a service worker that could keep an old
    // TMaps release. Remove only workers inside this app's GitHub Pages scope.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          const appPath = new URL(document.baseURI).pathname;
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(
            registrations
              .filter((registration) =>
                new URL(registration.scope).pathname.startsWith(appPath),
              )
              .map((registration) => registration.unregister()),
          );
        } catch (error) {
          console.warn('TMaps could not remove its old offline cache.', error);
        }
      });
    }
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    {{flutter_bootstrap_js}}
  </script>
</body>
</html>
